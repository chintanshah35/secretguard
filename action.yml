name: secretguard
description: Scan repository source for secrets, credentials, and PII
author: Chintan Shah

branding:
  icon: shield
  color: gray-dark

inputs:
  path:
    description: Path to scan
    required: false
    default: '.'
  args:
    description: Extra CLI arguments (for example --ignore tests --sarif results.sarif)
    required: false
    default: ''
  verify:
    description: Set to true to live-check supported provider keys (sends candidate secrets to APIs)
    required: false
    default: 'false'
  version:
    description: secretguard npm version or tag to run via npx
    required: false
    default: '1'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run secretguard
      shell: bash
      # Inputs go through env so a crafted value cannot inject shell
      env:
        SECRETGUARD_PATH: ${{ inputs.path }}
        SECRETGUARD_ARGS: ${{ inputs.args }}
        SECRETGUARD_VERIFY: ${{ inputs.verify }}
        SECRETGUARD_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ ! "$SECRETGUARD_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "secretguard: invalid version input \"$SECRETGUARD_VERSION\"" >&2
          exit 2
        fi
        read -ra extra_args <<< "$SECRETGUARD_ARGS"
        if [ "$SECRETGUARD_VERIFY" = "true" ]; then
          extra_args=(--verify ${extra_args[@]+"${extra_args[@]}"})
        fi
        npx --yes "secretguard@${SECRETGUARD_VERSION}" "$SECRETGUARD_PATH" ${extra_args[@]+"${extra_args[@]}"}
