name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Dogfood: secretguard must find nothing in its own tree beyond the known-safe baseline
      # (its own regex literals and documentation examples). Fails if a new secret-shaped
      # string lands in the repo.
      - run: node dist/cli/index.js . --baseline .secretguard-baseline.json
